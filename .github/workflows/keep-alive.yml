name: Keep Streamlit app awake

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (UTC), well inside the sleep window
  workflow_dispatch:          # lets you run it by hand from the Actions tab

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Visit the app (and wake it if it's asleep)
        env:
          APP_URL: https://johnmyatt-weather.streamlit.app/
        run: |
          python - <<'EOF'
          import os
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(url, wait_until="domcontentloaded", timeout=60000)
              page.wait_for_timeout(8000)

              # If the app has gone to sleep, Streamlit shows a wake-up button
              button = page.get_by_role("button", name="Yes, get this app back up!")
              if button.count() > 0:
                  print("App was asleep - clicking wake-up button")
                  button.first.click()
                  page.wait_for_timeout(60000)  # give it time to boot
              else:
                  print("App is awake")

              # Let the app itself load fully so it registers as a real visit
              page.wait_for_timeout(15000)
              print("Page title:", page.title())
              browser.close()
          EOF
